[project]
name = "gqa-mup"
version = "0.1.0"
description = "GQA-muP: Maximal Update Parameterization for Grouped Query Attention"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "wandb>=0.19.0",
    "tiktoken>=0.9.0",
    "numpy>=2.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
data = [
    "transformers>=4.40.0",
    "datasets>=3.0.0",
]
analysis = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
name = "pytorch-cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
