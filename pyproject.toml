[project]
name = "gqa-mup"
version = "0.1.0"
description = "GQA-muP: Maximal Update Parameterization for Grouped Query Attention"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "wandb>=0.19.0",
    "tiktoken>=0.9.0",
    "numpy>=2.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
data = [
    "transformers>=4.50.0",
    "datasets>=3.6.0",
]
analysis = [
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "jupyter",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu124"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
